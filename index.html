function invCalc(inv){
  const r=(+inv.vatRate||0)/100;let sub=0,gross=0;
  const lines=(inv.items||[]).map(it=>{const amt=+it.amount||0,qty=+it.qty||1;const net=inv.incl?amt/(1+r):amt;sub+=net;gross+=inv.incl?amt:amt*(1+r);return{...it,qty,net:r2(net),unit:r2(net/qty)}});

  if(cx){total=r2(+cx.fee||0);sub=r2(r?total/(1+r):total)}
  const vat=r2(total-sub);
  const paidIn=r2((inv.payments||[]).reduce((a,p)=>a+(+p.amount||0),0)),refunded=r2((inv.refunds||[]).reduce((a,p)=>a+(+p.amount||0),0));

  const max=Math.max(1,...data.flat());const W=560,H=210,L=56,B=28,T=12,cw=(W-L-8)/6;
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const k=[1,2,2.5,5,10].find(k=>k*p*4>=max)||10;return k*p})();const top=nice*4;

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" direction="ltr" role="img" aria-label="المبيعات والتكاليف">${g}</svg><div style="display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px"><span><span class="pill" style="background:var(--brand);padding:0 6px">&nbsp;</span> المبيعات قبل الضريبة</span><span><span class="pill" style="background:var(--gold);padding:0 6px">&nbsp;</span> تكاليف الموردين والمصروفات</span></div>`;
}

async function accSave(){
  const d=accDraft;const name=$("#ac_name").value.trim(),user=$("#ac_user").value.trim().toLowerCase(),pw=$("#ac_pw").value;
  if(!name||!user)return toast("أكمل الاسم واسم المستخدم");
  if(!/^[a-z0-9._-]{3,}$/.test(user))return toast("اسم المستخدم بالإنجليزي وأرقام فقط، 3 أحرف على الأقل");
  if(S.accounts.some(a=>a.username===user&&a.id!==d.id))return toast("اسم المستخدم مستخدم من قبل");
  if(!d.id&&pw.length<8)return toast("كلمة المرور 8 أحرف على الأقل");
  if(pw&&pw.length<8)return toast("كلمة المرور 8 أحرف على الأقل");
  const role=$("#ac_role").value;const active=$("#ac_act").value==="1";
  if(d.id===ME.id&&(!active||role!=="admin")&&ME.admin&&S.accounts.filter(a=>a.admin&&a.active!==false).length<=1)return toast("لا يمكن إلغاء آخر مدير للنظام");
  if(d.id&&user!==d.username)return toast("لا يمكن تغيير اسم المستخدم بعد إنشائه");
  if(d.id&&pw&&d.id!==ME.id)return toast("كلمة مرور موظف آخر لا تتغير من هنا — أوقف حسابه وأنشئ له مستخدم جديد، أو خليه يغيّرها من حسابه");
  const acc={...d,name,username:user,empId:$("#ac_emp").value,role,admin:role==="admin",active};delete acc.salt;delete acc.hash;
  let id=d.id;
  try{busy("جاري الحفظ…");
    if(!id){const sec=firebase.apps.find(x=>x.name==="sec")||firebase.initializeApp(window.FB_CONFIG,"sec");const cr=await sec.auth().createUserWithEmailAndPassword(uEmail(user),pw);id=cr.user.uid;await sec.auth().signOut();acc.createdAt=new Date().toISOString()}
    else if(pw&&id===ME.id)await firebase.auth().currentUser.updatePassword(pw);
    delete acc.id;await put("accounts",id,acc);await syncAvatar(acc);busy(null);closeModal();toast("تم حفظ المستخدم")}
  catch(err){busy(null);toast(err&&err.code&&String(err.code).includes("/")?fbErr(err):"تعذر الحفظ");if(err&&err.code==="auth/requires-recent-login")toast("سجّل خروج ودخول من جديد ثم غيّر كلمة المرور")}
}

const dWord=n=>n===1?"يوم واحد":n===2?"يومين":n<=10?`${n} أيام`:`${n} يوم`;
function custStage(c,st){
  const s=st||custStats(c.id),t=today(),dep=c.travelDate,ret=c.returnDate&&c.returnDate>=(dep||"")?c.returnDate:dep;let k,note="";
  if(!dep){k="nodate";note="أضف تاريخ السفر في ملف العميل"}
  else if(t<dep){k=s.paid>0.004?"ready":"pay";const d=dayDiff(t,dep);note=d===1?"يسافر غدًا":`يسافر بعد ${dWord(d)}`}
  else if(t<=ret){k="trip";note=t===dep?"سافر اليوم":t===ret?"يعود اليوم":`يعود بعد ${dWord(dayDiff(t,ret))}`}
  else{k="done";const d=dayDiff(ret,t);note=d===1?"عاد أمس":`عاد منذ ${dWord(d)}`}
  const pay=s.total<=0?["بدون فاتورة","p-mut","none"]:s.due<=0.004?["مدفوع بالكامل","p-ok","full"]:s.paid>0.004?["دفعة مقدمة","p-warn","part"]:["لم يدفع","p-bad","zero"];
  const nights=dep&&ret?dayDiff(dep,ret):null;
  return{k,label:STAGES[k][0],cls:STAGES[k][1],note,pay,nights,urgent:(k==="pay"||k==="ready")&&s.due>0.004&&dayDiff(t,dep)<=7};
}

function vPlan(v){if(Array.isArray(v.plan)&&v.plan.length)return v.plan;const st=(v.stays||[]).filter(s=>s.checkIn&&s.checkOut).sort((a,b)=>a.checkIn.localeCompare(b.checkIn));if(!st.length)return[];
  const out=[];st.forEach((s,i)=>{let d=nightsOf(s.checkIn,s.checkOut);if(i===0)d-=1;if(d>0)out.push({city:s.city,days:d,kind:v.service==="package"?"tour":(v.service==="car"?"tour":"free")})});return out}
function vchDays(v){
  const st=(v.stays||[]).filter(s=>s.checkIn&&s.checkOut).sort((a,b)=>a.checkIn.localeCompare(b.checkIn));if(!st.length)return[];
  const start=st[0].checkIn,end=st[st.length-1].checkOut,n=dayDiff(start,end);const old=new Map((v.days||[]).map(d=>[d.date,d]));const out=[];
  const plan=vPlan(v);const seq=[];plan.forEach(p=>{for(let k=0;k<(+p.days||0);k++)seq.push(p)});
  for(let i=0;i<=n&&i<60;i++){const date=addDays(start,i);const cur=st.find(s=>s.checkIn<=date&&date<s.checkOut);const prev=st.find(s=>s.checkOut===date);const pl=seq[i-1];const plx=i===0?seq[0]:i===n?seq[seq.length-1]:pl;const noTour=plx?plx.kind==="free":v.service!=="package";
    const city=(i>0&&i<n&&pl&&pl.city)||(cur||prev||{}).city||"";let type=i===0?"arrival":i===n?"departure":(prev&&cur&&prev!==cur?"move":(pl?(pl.kind==="free"?"free":"tour"):(v.service==="package"?"tour":"free")));
    const o=old.get(date);out.push({day:i+1,date,city:o&&o.cityEdited?o.city:city,cityEdited:o&&o.cityEdited,type:o&&o.typeEdited?o.type:type,typeEdited:o&&o.typeEdited,

}

const DRV_GS="/* المها هوليدز — رفع ملفات التسويق (تصميمات + تسجيلات صوتية) على جوجل درايف\n   انسخ الكود ده من البرنامج (بيانات الشركة ← ☁️) عشان المفتاح يكون جواه */\nconst KEY = \"%%KEY%%\";\nconst ROOT_NAME = \"المها هوليدز - الماركتينج\";\n\nfunction doPost(e) {\n  let r;\n  try {\n    const b = JSON.parse(e.postData.contents);\n    if (b.key !== KEY) throw new Error(\"مفتاح غلط\");\n    if (b.action === \"ping\") r = { ok: 1, email: Session.getEffectiveUser().getEmail(), root: root_().getUrl() };\n    else if (b.action === \"init\") r = init_(b);\n    else if (b.action === \"chunk\") r = chunk_(b);\n    else if (b.action === \"delete\") { try { DriveApp.getFileById(b.id).setTrashed(true); } catch (x) {} r = { ok: 1 }; }\n    else throw new Error(\"طلب غير معروف\");\n  } catch (err) { r = { ok: 0, error: String((err && err.message) || err) }; }\n  return ContentService.createTextOutput(JSON.stringify(r)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction doGet() { return ContentService.createTextOutput(\"OK — المها هوليدز\"); }\n\nfunction root_() { const it = DriveApp.getFoldersByName(ROOT_NAME); return it.hasNext() ? it.next() : DriveApp.createFolder(ROOT_NAME); }\nfunction sub_(parent, name) {\n  name = String(name || \"بدون اسم\").replace(/[\\\\\\/]/g, \" \").trim() || \"بدون اسم\";\n  const it = parent.getFoldersByName(name); return it.hasNext() ? it.next() : parent.createFolder(name);\n}\nfunction init_(b) {\n  let f = root_(); (b.path || []).forEach(function (p) { f = sub_(f, p); });\n  f.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);\n  const res = UrlFetchApp.fetch(\"https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable\", {\n    method: \"post\", contentType: \"application/json; charset=UTF-8\",\n    headers: { Authorization: \"Bearer \" + ScriptApp.getOAuthToken(), \"X-Upload-Content-Type\": b.mime || \"application/octet-stream\", \"X-Upload-Content-Length\": String(b.size) },\n    payload: JSON.stringify({ name: b.name, parents: [f.getId()] }), muteHttpExceptions: true\n  });\n  if (res.getResponseCode() !== 200) throw new Error(\"init \" + res.getResponseCode() + \" \" + res.getContentText().slice(0, 200));\n  const h = res.getAllHeaders();\n  return { ok: 1, session: h.Location || h.location, folder: f.getUrl() };\n}\nfunction chunk_(b) {\n  const bytes = Utilities.base64Decode(b.data);\n  const end = b.start + bytes.length - 1;\n  const res = UrlFetchApp.fetch(b.session, {\n    method: \"put\", contentType: b.mime || \"application/octet-stream\",\n    headers: { \"Content-Range\": \"bytes \" + b.start + \"-\" + end + \"/\" + b.total },\n    payload: bytes, muteHttpExceptions: true\n  });\n  const c = res.getResponseCode();\n  if (c === 308) return { ok: 1, more: 1 };\n  if (c === 200 || c === 201) {\n    const j = JSON.parse(res.getContentText());\n    const file = DriveApp.getFileById(j.id);\n    file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);\n    return { ok: 1, done: 1, id: j.id, link: file.getUrl() };\n  }\n  throw new Error(\"chunk \" + c + \" \" + res.getContentText().slice(0, 200));\n}\n/* شغّل الدالة دي مرة واحدة من المحرر لو طلب منك إذن (اختياري) */\nfunction test() { Logger.log(root_().getUrl()); }\n";
const DRV=()=>{const s=set();return s.driveUp&&s.driveKey?{url:s.driveUp,key:s.driveKey}:null};
const gThumb=(id,w)=>`https://drive.google.com/thumbnail?id=${id}&sz=w${w||400}`,gDl=id=>`https://drive.google.com/uc?export=download&id=${id}`;
async function drvCall(body,cfg){const d=cfg||DRV();if(!d)throw new Error("جوجل درايف مش متوصل");const r=await fetch(d.url,{method:"POST",body:JSON.stringify({...body,key:d.key})});let j;try{j=await r.json()}catch{throw new Error("رد غير مفهوم من جوجل درايف — اتأكد من اللينك والنشر (Anyone)")}if(!j.ok)throw new Error(j.error||"خطأ من جوجل درايف");return j}
async function drvUp(f,path,prog){const RAW=4*1024*1024,mime=f.type||"application/octet-stream";const ini=await drvCall({action:"init",name:f.name,mime,size:f.size,path});let st=0,res=null;
  while(st<f.size){const buf=await f.slice(st,st+RAW).arrayBuffer();let j,tries=0;for(;;){try{j=await drvCall({action:"chunk",session:ini.session,start:st,total:f.size,mime,data:b64(buf)});break}catch(e){if(++tries>=3)throw e;await new Promise(z=>setTimeout(z,1500))}}
    st+=buf.byteLength;prog&&prog(st/f.size);if(j.done)res=j}
  if(!res)throw new Error("الرفع مكملش — جرّب تاني");return{gid:res.id,link:res.link,folder:ini.folder}}

const durTxt=h=>h==null?"—":h<1?`${Math.max(1,Math.round(h*60))} دقيقة`:h<24?`${h.toFixed(1)} ساعة`:`${(h/24).toFixed(1)} يوم`;
const MKR=[["pub","نشر عروض",["نشر عرض للتسويق"]],["upd","تحديث عروض",["إرسال تحديث عرض للتسويق"]],["end","إنهاء عروض",["إنهاء عرض تسويق"]],["scr","نصوص اتكتبت",["نص تعليق صوتي جديد"]],["rec","تسجيلات اترفعت",["رفع تسجيل صوتي","تغيير تسجيل صوتي"]],["dreq","طلبات تصميم اتبعتت",["طلب تصميم صور جديد"]],["des","تصميمات خلصت",["تم الانتهاء من تصميم","تم الانتهاء من تصميم التسجيل"]]];
function mkRepData(m){const acts=(S.activity||[]).filter(a=>a.col==="packages"&&egD(a.at).slice(0,7)===m);const P={};const get=n=>P[n]||(P[n]={name:n,c:{},files:{img:0,vid:0},recH:[],desH:[],now:0,acts:[]});
  acts.forEach(a=>{const k=MKR.find(x=>x[2].includes(a.title));if(!k)return;const p=get(a.by||"—");p.c[k[0]]=(p.c[k[0]]||0)+1;p.acts.push(a)});
  (S.packages||[]).forEach(x=>{(x.dfiles||[]).forEach(f=>{if(f.at&&egD(f.at).slice(0,7)===m)get(f.by||x.designBy||"—").files[f.kind==="vid"?"vid":"img"]++});
    if(x.kind==="script"&&x.doneAt&&x.takenAt&&egD(x.doneAt).slice(0,7)===m)get(x.doneBy||"—").recH.push((Date.parse(x.doneAt)-Date.parse(x.takenAt))/36e5);
    if(x.designAt&&x.designTakenAt&&egD(x.designAt).slice(0,7)===m)get(x.designBy||"—").desH.push((Date.parse(x.designAt)-Date.parse(x.designTakenAt))/36e5);
    if(x.kind==="script"&&x.status==="doing"&&x.takenBy)get(x.takenBy).now++;if((x.kind==="dreq"||(x.kind==="script"&&x.status==="done"))&&x.design==="doing"&&x.designTakenBy)get(x.designTakenBy).now++});
  const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;const rows=Object.values(P).map(p=>({...p,recA:avg(p.recH),desA:avg(p.desH)})).sort((a,b)=>b.acts.length-a.acts.length);
  const T={};MKR.forEach(k=>T[k[0]]=rows.reduce((s,r)=>s+(r.c[k[0]]||0),0));T.img=rows.reduce((s,r)=>s+r.files.img,0);T.vid=rows.reduce((s,r)=>s+r.files.vid,0);
  const late=[...scAll().filter(x=>(x.status||"pending")==="pending"&&x.sentAt&&Date.now()-Date.parse(x.sentAt)>2*864e5).map(x=>({t:"نص مستني التسجيل",o:x,at:x.sentAt})),...dsAll().filter(x=>!x.design&&Date.now()-Date.parse(x.doneAt||x.sentAt||x.createdAt||0)>2*864e5).map(x=>({t:"مستني استلام التصميم",o:x,at:x.doneAt||x.sentAt||x.createdAt}))];
  return{rows,T,late,live:mkLive().length}}

function ntfFor(o){const n=o.ntf;if(!n||!ME||n.byId===ME.id)return false;if((o.ack||{})[ME.id]>=n.at)return false;
  if(n.to==="mkt")return can("mkt")&&ME.role!=="voice"&&!mkCanManage();if(n.to==="voice")return (can("vo")||can("scripts"))&&!scMan();if(n.to==="design")return visible("voices")&&!scMan();if(n.to==="man")return scMan();return false}
const NACK=(()=>{try{return JSON.parse(ls.get("erp-ntf-ack")||"{}")}catch{return{}}})();

function nAck(keys){const t=Date.now();[].concat(keys).forEach(k=>NACK[k]=t);const e=Object.entries(NACK);if(e.length>600)e.sort((a,b)=>a[1]-b[1]).slice(0,e.length-600).forEach(([k])=>delete NACK[k]);ls.set("erp-ntf-ack",JSON.stringify(NACK))}

function remList(){if(!ME)return[];const out=[],t=today();const add=(key,lvl,icon,title,txt,go)=>{if(!nAcked(key))out.push({key,lvl,icon,title,txt,go})};
  try{
  // 1) client follow-ups (own)
  if(visible("leads"))(S.leads||[]).filter(l=>l.ownerId===ME.id).forEach(l=>{const d=leadDue(l);if(!d)return;
    add(`lead|${l.id}|${l.followAt}|${t}`,d==="late"?3:2,"📞",d==="late"?"فات معاد متابعة عميل":"معاد متابعة عميل النهاردة",`${l.name||l.phone||"عميل"}${l.phone&&l.name?` · ${l.phone}`:""}\nالمعاد: ${fuTxt(l.followAt)}${l.country?`\nالدولة: ${l.country}`:""}`,{act:"leadOpen",id:l.id,hash:"leads"})});
  // 2) travel + balance before travel
  if(can("trips")||can("customers"))S.customers.forEach(c=>{const dep=c.travelDate;if(!dep)return;const dd=dayDiff(t,dep);const st=custStats(c.id);
    if(dd>=0&&dd<=2)add(`trip|${c.id}|${dep}|${t}`,dd===0?3:2,"✈️",dd===0?"عميل مسافر النهاردة":dd===1?"عميل مسافر بكرة":"عميل مسافر بعد يومين",`${c.name||""}${c.destination?` ← ${c.destination}`:""}\nتاريخ السفر: ${dAr(dep)}${st.due>0.004?`\n⚠️ لسه عليه ${sm(st,"due")}`:""}`,{act:"custOpen",id:c.id,hash:"trips"});
    else if(dd>2&&dd<=7&&st.due>0.004)add(`tripbal|${c.id}|${dep}|${t}`,2,"💰","عميل مسافر قريب ولسه عليه فلوس",`${c.name||""} مسافر ${dAr(dep)}\nالمتبقي عليه: ${sm(st,"due")}`,{act:"custOpen",id:c.id,hash:"trips"});
    if(c.returnDate===t&&c.returnDate!==dep)add(`ret|${c.id}|${t}`,1,"🏠","عميل راجع النهاردة",`${c.name||""}${c.destination?` من ${c.destination}`:""}`,{act:"custOpen",id:c.id,hash:"trips"})});

      try{const cols=[...COLS,"accounts"];let data=0,docs=0,att=0;cols.forEach(c=>(S[c]||[]).forEach(d=>{const n=JSON.stringify(d).length+64;data+=n;docs++;if(c==="attendance")att+=n}));

        box.innerHTML=`<div style="font-size:15px"><b>${MB(tot)} ميجا</b> <span class="muted">من 1024 ميجا مجانًا (${pct.toFixed(1)}%)</span></div>${bar}
          <table class="t" style="margin-top:8px"><tbody><tr><td>صور الجوازات والملفات</td><td class="n">${fc} ملف</td><td class="n"><b>${MB(files)} م</b></td></tr><tr><td>صور الحضور</td><td></td><td class="n"><b>${MB(att)} م</b></td></tr><tr><td>البيانات (فواتير، عملاء، موظفين…)</td><td class="n">${docs} سجل</td><td class="n"><b>${MB(data-att)} م</b></td></tr></tbody></table>
          <p class="muted" style="font-size:12px;margin:8px 0 0">${pct>80?"⚠️ قربت توصل للحد المجاني — فكّر في الترقية لـ Blaze أو امسح ملفات قديمة.":pct>60?"المساحة كويسة، بس تابعها كل شهر.":"✓ المساحة كويسة جدًا."} الرقم تقريبي؛ الرقم الرسمي في صفحة الباقة في Firebase.</p>`}
      catch(e){box.innerHTML=`<p class="muted">تعذر الحساب، جرّب تاني.</p>`}}break;
    case "sendWa":sendDlg("wa");break;
    case "sendMail":sendDlg("mail");break;
    case "sendGo":sendGo(t.dataset.how);break;
    case "sendBack":{const p=PREV;if(p&&p.kind==="pdf"){const b=p.back,to=p.to;SENDTO=to;PREV={back:b};previewPdf(p.html,p.filename,p.land)}else if(p&&p.kind==="csv"){const b=p.back,to=p.to;SENDTO=to;PREV={back:b};previewCsv(p.rows,p.filename)}}break;
    case "selRow":{e.stopPropagation();const k=t.dataset.k;const S2=SEL[k]||(SEL[k]=new Set());S2.has(id)?S2.delete(id):S2.add(id);render()}break;
    case "selAll":{e.stopPropagation();const k=t.dataset.k,L=LAST[k];if(!L)break;const S2=SEL[k]||(SEL[k]=new Set());const can=r=>!L.o.select.can||L.o.select.can(r);const ids=L.rows.filter(can).map(r=>r.id);
      if(S2.size===ids.length)S2.clear();else ids.forEach(i=>S2.add(i));render()}break;
    case "selClear":{(SEL[t.dataset.k]||new Set()).clear();render()}break;
    case "selDel":case "selDelAll":{const k=t.dataset.k,L=LAST[k];if(!L)break;const can=r=>!L.o.select.can||L.o.select.can(r);
      const ids=a==="selDel"?[...(SEL[k]||[])]:L.rows.filter(can).map(r=>r.id);if(!ids.length)break;
      confirmBtn(t,async()=>{busy(`جاري حذف ${ids.length}…`);try{for(let i=0;i<ids.length;i+=20)await Promise.all(ids.slice(i,i+20).map(x=>L.o.select.del(x)))}catch{}busy(null);(SEL[k]||new Set()).clear();toast(`تم حذف ${ids.length}`);render()})}break;
    case "pvSave":{try{const b=await (await fetch(window.__pv)).blob();await DL.save({filename:(t.dataset.n||"photo").replace(/[\\/:*?"<>|]+/g,"-")+".jpg",data:b,mimeType:"image/jpeg"})}catch{toast("تعذر التحميل")}}break;
    case "accPhotoDel":if(accDraft){accDraft.photo="";const box=$("#ac_av");if(box)box.innerHTML=avHTML(accDraft,"lg");t.remove()}break;
    case "accDel":confirmBtn(t,async()=>{const aid=accDraft.id,un=accDraft.username;closeModal();await del("accounts",aid);try{if(un)await DB.collection("avatars").doc(un).delete()}catch{}toast("تم حذف المستخدم")});break;
    case "rmLogo":{const s={...S.settings};delete s.logo;await saveSettings(s);toast("تمت إزالة الشعار");break}
    case "saveCo":{const s={...S.settings};["name","email","phone","address","trn","emirate","bankName","accountNo","iban","prefix","currency","workStart","workEnd","invoiceTerms","waNumber","waMsg","mailSubject","mailBody","mailCc","mailVia","waCode","tzDoc","tzRep","driveUp"].forEach(k=>{const el=$("#s_"+k);if(el)s[k]=el.value.trim()});["startNo","vatRate","dueDays","grace","otRate","otFriRate"].forEach(k=>{const el=$("#s_"+k);if(el)s[k]=+el.value||0});if($("#s_waCode"))s.waCode=ccVal("s_waCode")||"971";s.showCards=$("#s_showCards").checked;s.faceRequired=$("#s_faceReq").checked;
      const f=$("#s_logoFile").files[0];if(f){try{s.logo=await readLogo(f)}catch{return toast("تعذر قراءة صورة الشعار")}}try{await saveSettings(s);toast("تم حفظ بيانات الشركة")}catch{}break}
  }
});
let qTimer;
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="li_user"){clearTimeout(liT);liT=setTimeout(liLookup,350)}

  if(t.dataset.lf&&t.tagName==="INPUT"){UI[t.dataset.lf].f[t.dataset.fk]=t.value;clearTimeout(qTimer);qTimer=setTimeout(render,250)}
});
async function squarePhoto(file,size=256){const bm=await createImageBitmap(file);const side=Math.min(bm.width,bm.height);const c=document.createElement("canvas");c.width=c.height=size;c.getContext("2d").drawImage(bm,(bm.width-side)/2,(bm.height-side)/2,side,side,0,0,size,size);return c.toDataURL("image/jpeg",.82)}
document.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="ac_photo"&&t.files&&t.files[0]&&accDraft){try{accDraft.photo=await squarePhoto(t.files[0]);const box=$("#ac_av");if(box)box.innerHTML=avHTML(accDraft,"lg")}catch{toast("تعذر قراءة الصورة")}return}
  if(VD&&t.dataset.vday!=null){vDayInput(t);return}
  if(VD&&t.dataset.vp!=null){vSync();vPlanInput(t);drawV();return}
  if(VD&&t.dataset.vre){vSync();if(VD.v.plan&&!VD.v.planEdited)VD.v.plan=null;drawV();return}
  if(t.dataset.lf){if(UI[t.dataset.lf].f[t.dataset.fk]===t.value)return;UI[t.dataset.lf].f[t.dataset.fk]=t.value;render();return}
  if(t.dataset.ld){UI[t.dataset.ld][t.dataset.side]=t.value;render();return}
  if(t.dataset.att){if(!canW("attendance"))return;const k=t.dataset.att;
    if(!ME.admin&&k!=="status"&&(set().sites||[]).length){const emp=S.employees.find(x=>x.id===t.dataset.emp);const g=await geoGate(emp);CAMNOTE="";if(!g){render();return}}await saveAtt(t.dataset.emp,attDate,k==="status"?{status:t.value}:{[k]:t.value,[k+"M"]:"manual",[k+"P"]:null,[k+"By"]:ME.name});return}
  if(t.dataset.pay){const doc=S.payroll.find(p=>p.id===payMonth);const lines=doc.lines.map(l=>({...l}));lines[+t.dataset.i][t.dataset.pay]=+t.value||0;await put("payroll",payMonth,{...doc,lines,total:payTotal(lines)});return}
  if(t.id==="attDate"){attDate=t.value||today();render()}
  if(t.id==="attMonth"){attMonth=t.value||monthOf(today());render()}
  if(t.id==="actF"){actF=t.value;render()}
  if(t.id==="actDay"){actDay=t.value;render()}
  if(t.id==="payMonth"){payMonth=t.value||monthOf(today());render()}
  if(t.id==="vatFrom"){vatFrom=t.value;render()}
  if(t.id==="vatTo"){vatTo=t.value;render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#layer").innerHTML)closeModal();else if(GQ||menuOpen){GQ="";menuOpen=false;render()}}if(e.key==="Enter"&&e.target.id==="tk_note"){e.preventDefault();const b=$("[data-act=taskNote]");if(b)b.click()}});
function readLogo(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const m=360,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);let u=c.toDataURL("image/png");if(u.length>180000){const c2=document.createElement("canvas");c2.width=c.width;c2.height=c.height;const y=c2.getContext("2d");y.fillStyle="#fff";y.fillRect(0,0,c.width,c.height);y.drawImage(c,0,0);u=c2.toDataURL("image/jpeg",.9)}res(u)};img.onerror=rej;img.src=rd.result};rd.onerror=rej;rd.readAsDataURL(file)})}

route();boot();
