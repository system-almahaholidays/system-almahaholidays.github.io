function chart(){
  const ms=[...Array(6)].map((_,i)=>addMonths(monthOf(today()),i-5));
  const data=ms.map(m=>{let s=0,c=0;S.invoices.forEach(i=>{if(monthOf(i.date)===m)s+=invCalc(i).sub});S.bills.forEach(b=>{if(monthOf(b.date)===m)c+=billCalc(b).net});S.expenses.forEach(e=>{if(monthOf(e.date)===m)c+=(+e.amount||0)-(+e.vat||0)});return[s,c]});
  const max=Math.max(1,...data.flat());const W=560,H=210,L=56,B=28,T=12,cw=(W-L-8)/6;
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const k=[1,2,2.5,5,10].find(k=>k*p*4>=max)||10;return k*p})();const top=nice*4;
  const y=v=>T+(H-T-B)*(1-v/top);
  let g="";for(let i=0;i<=4;i++){const v=nice*i;g+=`<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${v>=1000?(v/1000)+"k":v}</text>`}
  data.forEach(([s,c],i)=>{const x=L+i*cw+cw*.18,bw=cw*.3;g+=`<rect x="${x}" y="${y(s)}" width="${bw}" height="${y(0)-y(s)}" rx="3" fill="var(--brand)"><title>مبيعات ${money(s)}</title></rect><rect x="${x+bw+3}" y="${y(c)}" width="${bw}" height="${y(0)-y(c)}" rx="3" fill="var(--gold)"><title>تكاليف ${money(c)}</title></rect><text x="${L+i*cw+cw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${AMON[+ms[i].slice(5)-1]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" direction="ltr" role="img" aria-label="المبيعات والتكاليف">${g}</svg><div style="display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px"><span><span class="pill" style="background:var(--brand);padding:0 6px">&nbsp;</span> المبيعات قبل الضريبة</span><span><span class="pill" style="background:var(--gold);padding:0 6px">&nbsp;</span> تكاليف الموردين والمصروفات</span></div>`;
}

function qRange(d){const y=+d.slice(0,4),q=Math.floor((+d.slice(5,7)-1)/3);return[`${y}-${pad(q*3+1)}-01`,`${y}-${pad(q*3+3)}-${daysInMonth(`${y}-${pad(q*3+3)}`)}`]}
let vatFrom,vatTo;{const[a,b]=qRange(today());vatFrom=a;vatTo=b}
function vatData(){const inR=d=>d&&d>=vatFrom&&d<=vatTo;let s5=0,s5v=0,s0=0,p=0,pv=0;
  S.invoices.filter(i=>inR(i.date)).forEach(i=>{const c=invCalc(i);if(+i.vatRate>0){s5+=c.sub;s5v+=c.vat}else s0+=c.sub});
  S.bills.filter(b=>inR(b.date)).forEach(b=>{const c=billCalc(b);if(c.vat>0){p+=c.net;pv+=c.vat}});
  S.expenses.filter(e=>inR(e.date)).forEach(e=>{if(+e.vat>0){p+=(+e.amount||0)-(+e.vat);pv+=+e.vat}});
  return{s5:r2(s5),s5v:r2(s5v),s0:r2(s0),p:r2(p),pv:r2(pv),net:r2(s5v-pv)}}

function vVat(){

const STAGES={pay:["بانتظار الدفع","p-bad"],ready:["تم الدفع · بانتظار السفر","p-br"],trip:["مسافر الآن","p-gold"],done:["رحلة مكتملة","p-ok"],nodate:["بدون تاريخ سفر","p-mut"]};
const STAGE_ORDER=["trip","ready","pay","nodate","done"];
const dayDiff=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const dWord=n=>n===1?"يوم واحد":n===2?"يومين":n<=10?`${n} أيام`:`${n} يوم`;
function custStage(c,st){
  const s=st||custStats(c.id),t=today(),dep=c.travelDate,ret=c.returnDate&&c.returnDate>=(dep||"")?c.returnDate:dep;let k,note="";
  if(!dep){k="nodate";note="أضف تاريخ السفر في ملف العميل"}
  else if(t<dep){k=s.paid>0.004?"ready":"pay";const d=dayDiff(t,dep);note=d===1?"يسافر غدًا":`يسافر بعد ${dWord(d)}`}
  else if(t<=ret){k="trip";note=t===dep?"سافر اليوم":t===ret?"يعود اليوم":`يعود بعد ${dWord(dayDiff(t,ret))}`}
  else{k="done";const d=dayDiff(ret,t);note=d===1?"عاد أمس":`عاد منذ ${dWord(d)}`}
  const pay=s.total<=0?["بدون فاتورة","p-mut","none"]:s.due<=0.004?["مدفوع بالكامل","p-ok","full"]:s.paid>0.004?["دفعة مقدمة","p-warn","part"]:["لم يدفع","p-bad","zero"];
  const nights=dep&&ret?dayDiff(dep,ret):null;
  return{k,label:STAGES[k][0],cls:STAGES[k][1],note,pay,nights,urgent:(k==="pay"||k==="ready")&&s.due>0.004&&dayDiff(t,dep)<=7};
}

function vPlan(v){if(Array.isArray(v.plan)&&v.plan.length)return v.plan;const st=(v.stays||[]).filter(s=>s.checkIn&&s.checkOut).sort((a,b)=>a.checkIn.localeCompare(b.checkIn));if(!st.length)return[];

  const start=st[0].checkIn,end=st[st.length-1].checkOut,n=dayDiff(start,end);const old=new Map((v.days||[]).map(d=>[d.date,d]));const out=[];
  const plan=vPlan(v);const seq=[];plan.forEach(p=>{for(let k=0;k<(+p.days||0);k++)seq.push(p)});
  for(let i=0;i<=n&&i<60;i++){const date=addDays(start,i);const cur=st.find(s=>s.checkIn<=date&&date<s.checkOut);const prev=st.find(s=>s.checkOut===date);const pl=seq[i-1];const plx=i===0?seq[0]:i===n?seq[seq.length-1]:pl;const noTour=plx?plx.kind==="free":v.service!=="package";
    const city=(i>0&&i<n&&pl&&pl.city)||(cur||prev||{}).city||"";let type=i===0?"arrival":i===n?"departure":(prev&&cur&&prev!==cur?"move":(pl?(pl.kind==="free"?"free":"tour"):(v.service==="package"?"tour":"free")));

function readLogo(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const m=360,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);let u=c.toDataURL("image/png");if(u.length>180000){const c2=document.createElement("canvas");c2.width=c.width;c2.height=c.height;const y=c2.getContext("2d");y.fillStyle="#fff";y.fillRect(0,0,c.width,c.height);y.drawImage(c,0,0);u=c2.toDataURL("image/jpeg",.9)}res(u)};img.onerror=rej;img.src=rd.result};rd.onerror=rej;rd.readAsDataURL(file)})}
